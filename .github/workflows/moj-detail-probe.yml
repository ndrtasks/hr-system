name: MOJ detail probe
on:
  push:
    branches: [feature/ndr-hr-academy-v3]
    paths:
      - 'scripts/moj-detail-probe.py'
      - '.github/workflows/moj-detail-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ndr-hr-academy-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/moj-detail-probe.py
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/moj-detail-probe.json
          git commit -m 'Probe lightweight MOJ judgment detail' || exit 0
          git pull --rebase origin feature/ndr-hr-academy-v3
          git push origin HEAD:feature/ndr-hr-academy-v3
