name: NDR UI QA
on:
  push:
    branches: [ndr-ui-qa, ndr-ui-repair-fullcase]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run NDR smoke checks
        run: node scripts/ndr-qa-smoke.mjs
      - name: Inspect production dependency advisories
        run: |
          npm audit --omit=dev --package-lock-only --json > /tmp/ndr-npm-audit.json || true
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/ndr-npm-audit.json','utf8'));const v=d.metadata?.vulnerabilities||{};console.log('Production dependency audit:',JSON.stringify(v));const rows=Object.entries(d.vulnerabilities||{}).filter(([,x])=>x&&['high','critical'].includes(x.severity)).map(([n,x])=>n+':'+x.severity);console.log('High/Critical packages:',rows.length?rows.join(', '):'none');"

  browser:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright for QA only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated local QA server
        run: |
          python3 -m http.server 4173 --directory public >/tmp/ndr-qa-http.log 2>&1 &
          echo $! >/tmp/ndr-qa-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ndr-hr-intelligence/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ndr-qa-http.log || true
          exit 1
      - name: Run rendered NDR browser QA
        env:
          NDR_QA_URL: http://127.0.0.1:4173/ndr-hr-intelligence/
        run: node scripts/ndr-browser-smoke.mjs
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndr-ui-qa-evidence
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 7
