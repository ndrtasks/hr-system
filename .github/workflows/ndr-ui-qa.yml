name: NDR UI QA
on:
  push:
    branches: [ndr-ui-qa]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run NDR smoke checks
        run: node scripts/ndr-qa-smoke.mjs
